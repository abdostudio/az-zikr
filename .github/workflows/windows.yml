# Builds the Windows app on GitHub's Windows machines (no Windows PC needed).
# - Every push: download "AZ-Zikr-Windows" from the run's Artifacts.
# - Push a tag like v1.0.0: the installer is attached to a GitHub Release automatically.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build (.NET Framework 4.8)
        shell: pwsh
        run: dotnet build windows/AZZikr/AZZikr.csproj -c Release -p:Version=${{ steps.v.outputs.version }} -o windows/publish

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} windows/installer.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path windows/publish/* -DestinationPath windows/output/AZ-Zikr-Portable-${{ steps.v.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AZ-Zikr-Windows
          path: windows/output/*

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: windows/output/*
